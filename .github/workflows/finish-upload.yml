name: Finish image migration

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update image links
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import html
          import re
          import shutil
          import urllib.parse
          import urllib.request
          from pathlib import Path

          pages = {
              "background": "https://ibb.co/Pzsx7KXD",
              "player": "https://ibb.co/FLB7WXwJ",
              "computer": "https://ibb.co/Y7cWY0Pr",
          }

          def direct_image(page):
              request = urllib.request.Request(page, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  text = response.read().decode("utf-8", "replace")

              patterns = [
                  r'<meta[^>]+property=["\']og:image["\'][^>]+content=["\']([^"\']+)',
                  r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:image["\']',
                  r'<meta[^>]+name=["\']twitter:image["\'][^>]+content=["\']([^"\']+)',
              ]

              for pattern in patterns:
                  match = re.search(pattern, text, re.I)
                  if match:
                      return html.unescape(match.group(1))

              raise RuntimeError(f"Kein Bildlink auf {page} gefunden")

          images = {name: direct_image(page) for name, page in pages.items()}

          for url in images.values():
              parts = urllib.parse.urlsplit(url)
              if parts.scheme != "https" or not parts.netloc:
                  raise RuntimeError(f"Ungültiger Bildlink: {url}")

          app_path = Path("public/iNoiizY/TicTacToe/app.js")
          css_path = Path("public/iNoiizY/TicTacToe/styles.css")
          headers_path = Path("public/_headers")
          test_path = Path("test/frontend.test.mjs")

          app = app_path.read_text()
          app = app.replace('"./assets/player.webp"', f'"{images["player"]}"')
          app = app.replace('"./assets/computer.webp"', f'"{images["computer"]}"')
          if "./assets/player.webp" in app or "./assets/computer.webp" in app:
              raise RuntimeError("Bildpfade in app.js konnten nicht ersetzt werden")
          app_path.write_text(app)

          css = css_path.read_text()
          css = css.replace('url("./assets/background.webp")', f'url("{images["background"]}")')
          if "./assets/background.webp" in css:
              raise RuntimeError("Hintergrundpfad konnte nicht ersetzt werden")
          css_path.write_text(css)

          origins = sorted({
              f'{urllib.parse.urlsplit(url).scheme}://{urllib.parse.urlsplit(url).netloc}'
              for url in images.values()
          })
          headers = headers_path.read_text()
          image_sources = " ".join(origins)
          headers = headers.replace("img-src 'self' data:;", f"img-src 'self' {image_sources} data:;")
          headers_path.write_text(headers)

          test = test_path.read_text()
          test = test.replace(
              'import { access, readFile } from "node:fs/promises";',
              'import { readFile } from "node:fs/promises";'
          )
          test = re.sub(
              r'\nawait access\(new URL\("public/iNoiizY/TicTacToe/assets/computer\.webp", root\)\);\nawait assert\.rejects\(access\(new URL\("public/iNoiizY/TicTacToe/assets/ai\.webp", root\)\)\);',
              '\nassert.doesNotMatch(js, /\\.\\/assets\\//);\nassert.doesNotMatch(css, /\\.\\/assets\\//);\nassert.match(js, /https:\\/\\/[^"\\s]+/);\nassert.match(css, /https:\\/\\/[^"\\s]+/);',
              test
          )
          test_path.write_text(test)

          shutil.rmtree("public/iNoiizY/TicTacToe/assets", ignore_errors=True)
          Path(".upload-trigger").unlink(missing_ok=True)
          Path(".github/workflows/finish-upload.yml").unlink(missing_ok=True)

          print("background:", images["background"])
          print("player:", images["player"])
          print("computer:", images["computer"])
          PY
          rmdir .github/workflows .github 2>/dev/null || true
      - name: Check
        shell: bash
        run: |
          npm install --package-lock=false
          npm run check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use hosted images"
          git push origin main
